# Host check (cargo check + UI script syntax), the payload build, a published release on every push to main, and draft releases on v* tags.
name: build

on:
  # Every push (any branch or tag) runs the check and the build; pushes to main publish a release, v* tags create a draft.
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      # Same toolchain as ps5/Dockerfile. The crate builds only for FreeBSD/PS5: no cargo test.
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-freebsd
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: cargo check --workspace
        run: cargo check --workspace --features unified-stack --locked --target x86_64-unknown-freebsd
      - name: cargo check --workspace (all optional payloads embedded)
        run: cargo check --workspace --features unified-stack,payload-kstuff,payload-etahen --locked --target x86_64-unknown-freebsd
      - name: node --check (src/ui.html script)
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' src/ui.html | sed '1d;$d' > "$RUNNER_TEMP/ui.js"
          test -s "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"

  payload:
    name: build payload
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            target/ps5/cargo/registry
            target/ps5/cargo/git
          key: payload-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: payload-cargo-
      - name: Stamp build version (major.minor from Cargo.toml, patch = run number)
        id: version
        run: |
          base=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          sed -i "0,/^version = \"$base\"/s//version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"titan-core\"$/{n;s/^version = \".*\"/version = \"$version\"/}" Cargo.lock
          grep -m1 '^version = ' Cargo.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: ps5/build.sh (Docker)
        run: TITAN_UNIFIED_STACK=1 bash ps5/build.sh
      - name: sha256
        run: |
          cp target/ps5/titan-core.elf TITAN-CORE.elf
          sha256sum TITAN-CORE.elf | tee SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: payload
          path: |
            TITAN-CORE.elf
            SHA256SUMS
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, payload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: payload
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            TITAN-CORE.elf SHA256SUMS

  publish:
    name: publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, payload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: payload
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.payload.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          sha256sum -c SHA256SUMS
          # Stable asset names keep .../releases/latest/download/TITAN-CORE.elf valid.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "TITAN CORE ${TAG} (${SHA::7})" \
            --generate-notes \
            --latest \
            TITAN-CORE.elf SHA256SUMS
