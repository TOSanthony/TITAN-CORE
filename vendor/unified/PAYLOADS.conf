# Payloads embedded in titan-core.elf when building with TITAN_UNIFIED_STACK=1.
#   1 = embedded (checked against SHA256SUMS, installed and started by TITAN CORE)
#   0 = not embedded (file is neither checked nor included)
# ShadowMountPlus is the library engine and must stay at 1.
#
# kstuff-lite = 0 and etaHEN = 1: etaHEN is started right after ShadowMountPlus and must provide kstuff.
# kstuff-lite = 1 and etaHEN = 1: kstuff starts first, etaHEN once both are ready.
# Both 0: TITAN CORE waits for a kstuff that something else loads.
kstuff-lite-v1.11.elf=0
shadowmountplus-1.7beta10.elf=1
etaHEN.elf=1
